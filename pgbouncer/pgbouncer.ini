;; ====================================================================
;; PgBouncer Configuration for Srushti AI (Local PostgreSQL)
;; ====================================================================

[databases]
;; Direct connection from PgBouncer to local PostgreSQL database
srushti = host=127.0.0.1 port=5432 dbname=srushti auth_user=postgres

;; Wildcard fallback for any database on local PostgreSQL instance
* = host=127.0.0.1 port=5432 auth_user=postgres

[pgbouncer]
;; Network configuration
listen_addr = 127.0.0.1
listen_port = 6432

;; Authentication
auth_type = plain
auth_file = userlist.txt
admin_users = postgres
stats_users = postgres

;; Pooling mode (transaction is best for serverless / microservices)
;; Note: prepared statements should remain disabled when using transaction mode
pool_mode = transaction

;; Connection limits
max_client_conn = 100
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
max_user_connections = 50

;; Timeouts
server_reset_query = DISCARD ALL
server_check_delay = 30
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0
idle_transaction_timeout = 0

;; Logging & process
logfile = pgbouncer.log
pidfile = pgbouncer.pid
verbose = 0
